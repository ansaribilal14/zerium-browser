name: Build Zerium

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
            echo "Keystore decoded from repository secret."
          else
            keytool -genkeypair -v -keystore "$GITHUB_WORKSPACE/release.keystore" \
              -storetype PKCS12 -alias zerium -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass zerium -keypass zerium \
              -dname "CN=Zerium Browser, OU=Zerium, O=Zerium, C=US"
            echo "WARNING: generated an ephemeral keystore. Set KEYSTORE_B64 for stable signatures."
          fi

      - name: Build APKs
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: zerium
          KEY_ALIAS: zerium
          KEY_PASSWORD: zerium
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease assembleDebug

      - name: Organize artifacts
        run: |
          mkdir -p out
          SHA=$(git rev-parse --short HEAD)
          VER=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          echo "Building version ${VER} (${SHA})"
          cp app/build/outputs/apk/release/app-release.apk "out/Zerium-${VER}-r${SHA}-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "out/Zerium-${VER}-r${SHA}-debug.apk"
          ls -la out/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Zerium-APKs
          path: out/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish to latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes || true
          git push origin :refs/tags/latest || true
          gh release create latest out/*.apk \
            --target "$GITHUB_SHA" \
            --title "Zerium Browser - Latest Build" \
            --notes "Automated build of commit $GITHUB_SHA.

          Install Zerium-*-release.apk. Debug build included for testing.

          This is a rolling release: the tag latest always points at the newest successful build of main."

      - name: Notify Telegram
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ]; then
            echo "Telegram secrets not set; skipping notification."
            exit 0
          fi
          STATUS="${{ job.status }}"
          REL_URL="https://github.com/${{ github.repository }}/releases/tag/latest"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "$STATUS" = "success" ]; then
            EMOJI="OK"
          else
            EMOJI="FAILED"
          fi
          MSG="Zerium build #${{ github.run_number }}: ${EMOJI}
          Commit: ${{ github.sha }}
          APK: ${REL_URL}
          Logs: ${RUN_URL}"
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" --data-urlencode "text=${MSG}" > /dev/null || true
