name: Feature request
description: Propose an improvement or new capability
labels: [ "enhancement" ]
body:
  - type: markdown
    attributes:
      value: |
        Feature requests are welcome — please frame them against the project's principles (honesty, native transparent blocking, reproducibility). Features that require telemetry or native advertising SDKs will not be considered.

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What can you not do today, or what annoys you? Describe the user-visible scenario, not the implementation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to happen? Sketches of UI/UX are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, or how other browsers solve this.

  - type: checkboxes
    id: contribute
    attributes:
      label: Willingness to contribute
      options:
        - label: I am willing to submit a pull request for this feature
