plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zerium.browser'
    compileSdk 34

    defaultConfig {
        applicationId "com.zerium.browser"
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName "1.3.0"
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("KEYSTORE_FILE")
            storeFile file(ksPath != null && !ksPath.isEmpty() ? ksPath : "release.keystore")
            def sp = System.getenv("KEYSTORE_PASSWORD")
            storePassword sp != null && !sp.isEmpty() ? sp : "zerium"
            def al = System.getenv("KEY_ALIAS")
            keyAlias al != null && !al.isEmpty() ? al : "zerium"
            def kp = System.getenv("KEY_PASSWORD")
            keyPassword kp != null && !kp.isEmpty() ? kp : "zerium"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
